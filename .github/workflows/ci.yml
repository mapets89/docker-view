name: DockerView CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version: "1.26.x", cache-dependency-path: backend/go.sum}
      - run: go test -race -coverprofile=coverage.out ./...
        working-directory: backend
      - run: go vet ./...
        working-directory: backend
      - uses: golangci/golangci-lint-action@v8
        with: {version: v2.12.2, working-directory: backend}
      - run: go build ./cmd/...
        working-directory: backend
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with: {node-version: "26.x", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config --quiet
      - run: docker build -f docker/Dockerfile -t dockerview/server:ci .
      - run: docker build -f docker/Dockerfile.gateway -t dockerview/gateway:ci .
      - run: docker build -f docker/Dockerfile.secret-init -t dockerview/secret-init:ci .
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: dockerview/server:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: dockerview/gateway:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: dockerview/secret-init:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
