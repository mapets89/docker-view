name: "🐛 Bug Report"
description: Report a problem or unexpected behavior in DockerView.
title: "[Bug] "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue!
        Please provide as much detail as possible to help reproduce the problem.

        ⚠️ Never include passwords, tokens, API keys, or sensitive information.

  - type: input
    id: version
    attributes:
      label: DockerView Version
      description: Which version of DockerView are you using?
      placeholder: "e.g. v1.0.0"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Web UI
        - Backend / API
        - Docker Gateway
        - Authentication / Authorization
        - Container Management
        - Logs / Terminal
        - Installation / Deployment
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: What happened?
      placeholder: Describe the problem you encountered.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open DockerView
        2. Navigate to...
        3. Click on...
        4. Observe the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide relevant environment information.
      placeholder: |
        OS: Ubuntu 24.04
        Docker: 28.x
        Docker Compose: 2.x
        Browser: Chrome
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Add relevant logs, error messages or screenshots. Remove sensitive data before submitting.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before Submitting
      options:
        - label: I have checked existing issues for duplicates.
          required: true
        - label: I have removed sensitive information from the report.
          required: true